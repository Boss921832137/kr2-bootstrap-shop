<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Форма заявки на покупку в магазине Зерно.">
  <title>Заявка — Зерно</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="d-flex flex-column min-vh-100">
  <header>
    <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">Зерно</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
            <li class="nav-item"><a class="nav-link" href="catalog.html">Каталог</a></li>
            <li class="nav-item"><a class="nav-link" href="product.html">Товар</a></li>
            <li class="nav-item"><a class="nav-link active" href="order.html">Заявка</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="flex-grow-1">
    <div class="container py-5">
      <div class="row">
        <div class="col-12 col-md-10 col-lg-7">
          <h1 class="mb-4">Оформление заявки</h1>

          <div class="alert alert-info">
            После отправки заявки мы перезвоним вам в течение 15 минут.
          </div>

          <form action="#" method="post">
            <div class="mb-3">
              <label class="form-label" for="name">Имя</label>
              <input class="form-control" id="name" name="name" type="text" required>
            </div>

            <div class="mb-3">
              <label class="form-label" for="email">E-mail</label>
              <input class="form-control" id="email" name="email" type="email" required>
            </div>

            <div class="mb-3">
              <label class="form-label" for="phone">Телефон</label>
              <div class="input-group">
                <span class="input-group-text">+7</span>
                <input class="form-control" id="phone" name="phone" type="tel" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label" for="product">Товар</label>
              <select class="form-select" id="product" name="product" required>
                <option value="">Выберите товар</option>
                <option value="ethiopia">Кофе Эфиопия</option>
                <option value="brazil">Кофе Бразилия</option>
                <option value="colombia">Кофе Колумбия</option>
                <option value="french-press">Френч-пресс</option>
                <option value="cezve">Турка</option>
                <option value="pour-over">Воронка</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label" for="comment">Комментарий</label>
              <textarea class="form-control" id="comment" name="comment" rows="4"></textarea>
            </div>

            <div class="form-check mb-3">
              <input class="form-check-input" id="agree" name="agree" type="checkbox" required>
              <label class="form-check-label" for="agree">Согласен на обработку персональных данных</label>
            </div>

            <button class="btn btn-primary" type="submit">Отправить заявку</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white py-3">
    <div class="container">© 2026 Зерно. Учебный проект.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
